services:
  - type: web
    name: dryeyeapp
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn dryeye_project.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: dryeye_project.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: NODE_VERSION
        value: "22"
