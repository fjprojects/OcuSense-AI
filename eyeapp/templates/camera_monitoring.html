{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f5132">
    <title>Camera Monitoring - Ocusense AI</title>
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <link rel="icon" href="{% static 'icon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            background: radial-gradient(circle at top, #04090f 0%, #08151f 32%, #06111c 100%);
            min-height: 100vh;
            color: #e6f8ff;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #4ad7a8;
            margin-bottom: 1rem;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 2rem;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #e6f8ff;
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .content {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 2rem;
            backdrop-filter: blur(10px);
        }

        .feature-description {
            margin-bottom: 2rem;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .placeholder {
            text-align: center;
            padding: 3rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .placeholder i {
            font-size: 4rem;
            color: #4ad7a8;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="{% url 'home' %}" class="back-button"><i class="fas fa-arrow-left"></i> Back to Home</a>
        
        <div class="header">
            <h1><i class="fas fa-video"></i> Camera Monitoring</h1>
        </div>
        
        <div class="content">
            <div class="feature-description">
                Activate AI blink detection and face tracking in real time to monitor eye health.
            </div>
            
            <div class="placeholder">
                <i class="fas fa-camera"></i>
                <h3>AI Camera Monitoring</h3>
                <p>This feature is under development. It will use your camera for real-time blink detection and eye tracking.</p>
            </div>
        </div>
    </div>
</body>
</html>
