name: Checks
on:
  push:
    branches: [main, fix/reminders-camera-deployment]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      CI: "true"
      PUBLIC_URL: /static/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm --prefix frontend ci --include=dev --no-audit --no-fund
      - run: npm --prefix frontend test -- --watchAll=false --runInBand
      - run: npm --prefix frontend run build
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python manage.py migrate --noinput
      - run: python manage.py check
      - run: python manage.py test eyeapp
